<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSM Query Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        :root {
            --primary-dark: #1e1e1e;
            --primary-dark-hover: #2a2a2a;
            --accent-dark: #ff4444;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-dark: #3a3a3a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica', sans-serif;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-white);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--primary-dark-hover);
            padding: 2rem;
            border-right: 1px solid var(--border-dark);
            box-shadow: var(--shadow-sm);
        }

        .main-content {
            flex: 1;
            max-width: 50rem;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-white);
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 7rem;
            padding-bottom: 2rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--accent-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .user-message {
            align-items: flex-end;
        }

        .assistant-message {
            align-items: flex-start;
        }

        .message-content {
            background-color: var(--primary-dark-hover);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            max-width: 85%;
            box-shadow: var(--shadow-sm);
        }

        .user-message .message-content {
            background-color: var(--accent-dark);
        }

        .message-content pre {
            background-color: var(--primary-dark);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .message-content code {
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 0.2em 0.4em;
            background-color: var(--primary-dark);
            border-radius: 0.3em;
            font-size: 0.9em;
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background-color: var (--primary-dark-hover);
            box-shadow: var(--shadow-sm);
        }

        .message-content th,
        .message-content td {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-dark);
            text-align: left;
        }

        .message-content th {
            background-color: var(--primary-dark);
            font-weight: 600;
        }

        .input-section {
            position: fixed;
            bottom: 0;
            left: 280px;
            right: 0;
            background-color: var(--primary-dark);
            padding: 1.5rem;
            border-top: 1px solid var(--border-dark);
        }

        .textarea-wrapper {
            max-width: 50rem;
            margin: 0 auto;
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 60px;
            max-height: 200px;
            padding: 1.25rem;
            padding-right: 4rem;
            border: 2px solid var(--border-dark);
            border-radius: 1rem;
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-white);
            background-color: var(--primary-dark-hover);
            resize: none;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            font-weight: 450;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 4px rgba(255, 68, 68, 0.1);
        }

        .send-button {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            background: var(--accent-dark);
            border: none;
            color: var(--text-white);
            cursor: pointer;
            padding: 0.75rem;
            border-radius: 0.75rem;
            transition: var(--transition);
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #ff3333;
        }

        .control-button {
            background: var(--primary-dark-hover);
            border: none;
            color: var(--text-white);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }

        .control-button:hover {
            background-color: var(--accent-dark);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            background-color: var(--primary-dark-hover);
            color: var(--text-white);
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(1rem);
            transition: var(--transition);
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .input-section {
                left: 0;
            }

            .main-content {
                padding: 2rem 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }
        }

        .conversation-list {
            margin-top: 2rem;
            list-style: none;
            padding: 0;
        }

        .conversation-list li {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .conversation-list li:hover {
            background-color: var(--accent-dark);
        }

        .conversation-list li.active {
            background-color: var(--accent-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <button class="control-button" onclick="newConversation()">
                <i class="fas fa-plus"></i>
                New Conversation
            </button>
            <ul class="conversation-list" id="conversationList">
                <!-- Conversations will be listed here -->
            </ul>
        </aside>

        <div class="main-content">
            <header class="header">
                <h1>CSM Query System</h1>
                <p>Get instant AI-powered insights and answers</p>
            </header>

            <div class="chat-container" id="chatContainer">
                <!-- Chat messages will be inserted here -->
            </div>
        </div>

        <div class="input-section">
            <div class="textarea-wrapper">
                <textarea 
                    id="queryText" 
                    placeholder="Type your question here..."
                    maxlength="1000"
                    rows="1"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-button" onclick="sendQuery()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let conversations = [];
        let currentConversationIndex = null;

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        function addMessage(content, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            
            const messageHeader = document.createElement('div');
            messageHeader.className = 'message-header';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = isUser ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            const sender = document.createElement('span');
            sender.textContent = isUser ? 'You' : 'Assistant';
            
            messageHeader.appendChild(avatar);
            messageHeader.appendChild(sender);
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = isUser ? content : formatResponse(content);
            
            messageDiv.appendChild(messageHeader);
            messageDiv.appendChild(messageContent);
            
            chatContainer.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth' });

            if (currentConversationIndex !== null) {
                conversations[currentConversationIndex].messages.push({ content, isUser });
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function formatResponse(text) {
            if (text.includes('|') || text.includes('```')) {
                return marked.parse(text);
            }
            return text;
        }

        function sendQuery() {
            const textarea = document.getElementById('queryText');
            const queryText = textarea.value.trim();

            if (!queryText) {
                showToast('Please enter your question first');
                return;
            }

            addMessage(queryText, true);

            fetch('/query/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: queryText })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                addMessage(data.result);
                textarea.value = '';
                textarea.style.height = 'auto';
                showToast('Response received successfully!');
            })
            .catch(error => {
                addMessage(`Error: ${error.message}`);
                showToast('Failed to get response', 5000);
            });
        }

        function newConversation() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            currentConversationIndex = conversations.length;
            conversations.push({ messages: [] });
            updateConversationList();
        }

        function updateConversationList() {
            const conversationList = document.getElementById('conversationList');
            conversationList.innerHTML = '';
            conversations.forEach((conversation, index) => {
                const li = document.createElement('li');
                li.textContent = `Conversation ${index + 1}`;
                li.className = index === currentConversationIndex ? 'active' : '';
                li.onclick = () => loadConversation(index);
                conversationList.appendChild(li);
            });
        }

        function loadConversation(index) {
            currentConversationIndex = index;
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            conversations[index].messages.forEach(message => {
                addMessage(message.content, message.isUser);
            });
            updateConversationList();
        }

        document.getElementById('queryText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        });

        // Initialize with a new conversation
        newConversation();
    </script>
</body>
</html>
